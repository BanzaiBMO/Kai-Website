My Life

<!-- Japanese 

My parents and teachers pressed hard on my English ability through my childhood, so learning Japanese was only a fantasy (To this day, my parents do not speak Japanese to me.) But, after 8th grade, when I felt confident with my English, I began to learn Japanese. Besides the break I took during college admissions, I have never stopped learning the language. I am proud to present all that I have been doing to improve my Japanese.

I wrote a guidebook of basic vocabulary taken from YouTube videos. I copied sentences I did not understand and learned from translations without context. It would take me years to realize this mistake.

At the same time, I began learning kanji characters by the grades they are taught in Japanese schools (I learned 1st-6th grade kanji; ~1000 kanji). I used to think writing them over and over was enough, but I realized early on that I could use my imagination to have them stick easier.

During lockdown, I started reviewing Anki cards and the Remembering the Kanji I book (containing 2200 kanji). I loved the use of mnenomics to affix English words to a character by breaking it down into smaller components, or characters of a made-up story. In 6 months, I recognized over 1500 characters.

I then started the "monolingual transition", ditching bilingual (E-J) dictionaries for monolingual (J-J) ones. Again, I was copying sentences I did not understand, and eventually I burned out of vocabulary and took a hiatus.

I also started to focus on kanji readings. My approach was to learn them by reading, where each reading was a themed memory palace where each kanji's English keyword fit in with its theme. This had limited success in language immersion.

In college, I programmed a Java game quizzing the onyomi (Chinese readings) of the kanji, taking into account those with many readings. There, my scope of kanji characters to learn has increased from 2200 to 3000 characters.

Today, I am revising basic Japanese grammar with Japanese explanations and I am relearning basic words in Japanese. I am also drawing pictures capturing the meaning/feeling of the target word/phrase for when I hear it in real conversation. I am using the memorization techniques I have learned recently to better recall grammar concepts and kanji with identical components.

<!-- Programming

My first "real" program I did was in 2024 with a Minecraft Color-to-Block Matcher for color-matching for pixel art or real-life (inspired) builds. It uses an enum of blocks, each with unique RGB values, to find the 10 closest blocks to the desired color.

When I learned how to use Java APIs and JavaFX in UGA, I made a Chinese-English Dictionary App allowing the user to translate sentences with the Wiktionary API and look up individual characters with the Chinese Character Web API. It is compatible with both traditional and simplified characters.

I practiced with Java data structures by creating my own array API that treats 1D arrays as 2D arrays with easy-to-change indices. An example of this in action is with a Unicode character painter tool, and the user can copy and paste the final painting.

While I was in Japan, I made a game that quizzes one type of Japanese character readings, onyomi (used in compound words). I made a linked list data structure of nodes where each reading is sorted in dictionary order and have "chains" of those that share that reading. This is used to give feedback to the user on correct/incorrect answers, especially for those with more than one reading. If the user enters the correct answer, the character is suspended for 60 rounds before it can be drawn at random again.

My favorite class at UGA is Systems Programming, which teaches the C language and the fundamentals of coding. This is a multi-threaded program that takes a .txt file with a square grid of #s 0-9 and finds the horizontal, vertical, and diagonal sums for a desired number. Because the size of the grid can vary, it uses dynamic memory to copy the grid #s into the heap for the sums to be evaluated.

Also with C, I built a server-client without library call functions and using system calls instead. Once I connect the server program to a free port in a machine, a client program can try to connect to the server so messages can be sent from both programs. 

-->
<!-- Electronics

I worked on a USB-C phone charger that transforms AC wall power into a steady DC input for safe wattage for the phone. It uses a step-down transformer and a full-wave rectifier for an easier AC to DC conversion, as well as a heat sink to bear excess heat without burning the charger or the connected device.

When I took an intensive design course that divided the class into smaller teams, we worked on an electric workbench (from scratch!) that runs from Raspberry Pi OS and implements a voltmeter, ohmmeter, DC reference, and a sinewave + square wave generator. For my team, I worked on the ohmmeter program, the SAR ADC circuit design, and oversought the file structure and code readability. Moreover, I wrote the user manual and the software portion of the technical document. We were one of 13/20 teams that passed all requirements for the project.

During the summer, I built a robotic interactive pet that uses sensors to respond to the environment, specifically the room brightness, object proximity, and capacitive touch (petting). It responds by changing its emotions to become uncomfortable, scared, or excited from the change in environment. It is also an Internet of Things application because it transfers emotional data via WiFi to be outputted onto a webpage of live data.
*YouTube link*

Relating to the robotic pet project, I learned how to use KiCad for the first time and achieved a two-layer PCB design if my pet used one instead of breadboards. It uses two ground planes with all componented grounded to them through vias and signal and power connections at different widths to withstand surrounding electromagnetic noise, however it is not an optimal design due to its large surface area; in the future, I will learn to do less common PCB designs such as an 'L' shaped design that would have better suited the pet.
